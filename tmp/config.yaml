kind: ConfigMap
apiVersion: v1
metadata:
  name: authelia-config
  namespace: auth
  labels:
    app.kubernetes.io/managed-by: Helm
    meta.helm.sh/release-name: authelia
    meta.helm.sh/release-namespace: auth
  annotations:
    meta.helm.sh/release-name: authelia
    meta.helm.sh/release-namespace: auth
data:
  configuration.yml: |
    server:
      address: 'tcp://:9091'

    theme: 'dark'

    # Log settings
    log:
      level: trace
      format: 'text' 
      keep_stdout: true      

    # Authentication backend using ldap
    authentication_backend:
      password_reset:
        disable: true
      password_change:
        disable: true
      ldap:
        implementation: glauth
        address: ldap://glauth
        base_dn: dc=latam,dc=redhat
        user: cn=redhat,cn=ssa,dc=latam,dc=redhat
        users_filter: (&({username_attribute}={input})(objectClass=posixAccount))
        groups_filter: (&(uniqueMember={dn})(objectClass=posixGroup))
        password: {{- secret "/secrets/ldap_passwd" }}

    # Access control rules
    access_control:
      default_policy: "one_factor"
      rules:
        - domain: "apps.acmlab.202y.p3.openshiftapps.com"
          policy: one_factor

    # Session settings
    session:
      name: "authelia_session"
      secret: {{- secret "/secrets/session" }}
      remember_me: -1
      cookies:
      - domain: "apps.acmlab.202y.p3.openshiftapps.com"
        authelia_url: "https://authelia.apps.acmlab.202y.p3.openshiftapps.com"

    storage:
      encryption_key: {{ secret "/secrets/storage" }}
      local:
        path: '/tmp/db.sqlite3'

    notifier:
      filesystem:
        filename: '/tmp/notification.txt'

    # OpenID Connect 1.0 Provider settings
    identity_providers:
      oidc:
        lifespans:
          access_token: 1h
          refresh_token: 30d        
        cors:
          endpoints:
          - authorization
          - token
          - userinfo
          - introspection
          - revocation
          allowed_origins_from_client_redirect_uris: true
        jwks:
          - key_id: 'authelia-rsa-key'
            algorithm: 'RS256'
            use: 'sig'
            key: |-
              {{- secret "/secrets/jwkskey" | nindent 14 }}
        claims_policies:
          trustify_policy:
            access_token:
            - groups
            id_token:
            - groups     
          tas_policy:
            id_token:
            - name
            - email
            - email_verified
            - preferred_username   
        scopes:
          rhtpadw: {}
          rhtpadr: {}
          rhtpadu: {}
          rhtpadd: {}
        clients:
          - client_id: devhub
            client_name: devhub
            client_secret: {{- secret "/secrets/devhub" }}
            authorization_policy: one_factor
            consent_mode: implicit
            public: false
            redirect_uris:
              - https://backstage-rhdh-rhdh.apps.acmlab.202y.p3.openshiftapps.com/api/auth/oidc/handler/frame
            scopes:
              - openid
              - profile
              - email
              - groups
              - offline_access
            grant_types:
              - refresh_token
              - authorization_code
            response_types:
              - code
            userinfo_signed_response_alg: none

          - client_id: rhtpa-cli
            client_name: rhtpa-cli
            client_secret: {{- secret "/secrets/rhtpacli" }}
            authorization_policy: one_factor
            consent_mode: implicit
            public: false
            redirect_uris: []
            scopes:
              - openid
              - profile
              - email
              - groups
              - offline_access
              - rhtpadw
              - rhtpadr
              - rhtpadu
              - rhtpadd
            grant_types:
              - authorization_code
            response_types:
              - code
              - token
              - id_token
              - id_token token
            access_token_signed_response_alg: 'RS256'

          - client_id: rhtpa-front
            client_name: rhtpa-front
            authorization_policy: one_factor
            consent_mode: implicit
            # pre_configured_consent_duration: 1y
            public: true
            require_pkce: true
            pkce_challenge_method: S256
            claims_policy: trustify_policy
            redirect_uris:
              - https://server-tpa.apps.acmlab.202y.p3.openshiftapps.com
              - https://server-tpa.apps.acmlab.202y.p3.openshiftapps.com/*
            scopes:
              - openid
              - profile
              - email
              - groups
              - rhtpadw
              - rhtpadr
              - rhtpadu
              - rhtpadd
            grant_types:
              - authorization_code
              - implicit
            response_types:
              - code
              - token
              - id_token
              - id_token token
            response_modes:
              - 'query'            
              - 'fragment'
              - 'form_post'
            token_endpoint_auth_method: none
            access_token_signed_response_alg: 'RS256'

          - client_id: trusted-artifact-signer
            client_name: trusted-artifact-signer
            client_secret: {{- secret "/secrets/tas" }}
            public: false
            authorization_policy: one_factor
            consent_mode: implicit
            claims_policy: tas_policy
            scopes: 
              - openid
              - profile
              - email
            grant_types:
              - 'urn:ietf:params:oauth:grant-type:device_code'
            token_endpoint_auth_method: 'client_secret_post'  
            access_token_signed_response_alg: 'RS256'

