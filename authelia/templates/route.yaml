{{- if .Values.route }}
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: authelia
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}   
spec:
  host: {{ .Values.authelia_host_name }}.{{ .Values.domain }}
  {{- .Values.route.default | toYaml | nindent 2 }}
{{- end }}

