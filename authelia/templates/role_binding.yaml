apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader-deleter-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}   
rules:
- apiGroups: [""] 
  resources: ["secrets"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-secret-cleaner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm.labels" . | nindent 4 }}   
subjects:
- kind: ServiceAccount
  name: default
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: secret-reader-deleter-role
  apiGroup: rbac.authorization.k8s.io