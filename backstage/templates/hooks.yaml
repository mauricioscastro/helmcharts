apiVersion: batch/v1
kind: Job
metadata:
  name: remove-{{ .Release.Name }}-operator-csv
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded
  labels:
    {{- include "helm.labels" . | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: delete-devspaces-operator
          image: quay.io/zcve/bashkc
          command:
            - bash
            - -c    
            - |
              kubectl delete --ignore-not-found=true subscription {{ .Values.spec.name }} -n {{ .Release.Namespace }}
              kubectl delete --ignore-not-found=true csv {{ .Values.spec.startingCSV }}
